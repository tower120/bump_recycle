name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v6
      - run: RUSTFLAGS="--deny warnings" cargo build
      - run: RUSTFLAGS="--deny warnings" cargo +nightly build --all-features

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --feature-powerset
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: "--deny warnings"

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@cargo-nextest
      - uses: actions/checkout@v6

      - run: cargo hack test --feature-powerset
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: "--deny warnings"

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v6
      - run: cargo +nightly build --benches --all-features

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v6
      - run: RUSTFLAGS="--deny warnings" cargo doc --lib

  docrs:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/checkout@v6
      - run:
          RUSTFLAGS="--deny warnings"
          RUSTDOCFLAGS="--cfg docsrs"
          cargo +nightly doc --lib --all-features